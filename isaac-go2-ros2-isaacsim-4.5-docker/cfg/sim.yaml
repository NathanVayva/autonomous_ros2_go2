defaults:
  - _self_

num_envs: 1
freq: 50 # can only be divisible by 200 (50 Hz = decimation 4, matches the policy's training rate)
camera_follow: True
env_name: obstacle-dense
# env_name: full-warehouse

sensor:
  enable_lidar: True
  enable_camera: True
  color_image: True
  depth_image: True
  semantic_segmentation: True

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: False