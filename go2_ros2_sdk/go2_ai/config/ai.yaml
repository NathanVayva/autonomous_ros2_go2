# Réglages du nœud go2_ai (modifiables SANS recompiler).
# Le nom de clé 'go2_ai' doit correspondre au nom du nœud (Node("go2_ai")).
go2_ai:
  ros__parameters:
    # LE bouton : nom d'un backend défini dans go2_ai/adapter/registry.py.
    backend: "qwen3_vl_4b"

    # Device d'inférence : "cuda" (GPU, quantif 4-bit) ou "cpu" (RAM, pleine
    # précision). Passe "cpu" si le GPU est déjà pris (Isaac Sim sur 8 Go).
    device: "cuda"

    # Mode de production du but (UN seul sélecteur des 3 voies) :
    #   "heading" = le modèle donne cap + distance -> _heading_to_world (sans calibration).
    #   "pixel"   = le modèle pointe un pixel caméra -> _pixel_to_world() (placeholder à finir).
    #   "map_som" = CARTE annotée (flèche robot + POI numérotés), le modèle choisit un
    #               numéro -> goal en repère map. Nécessite carte chargée + localisation (TF map).
    nav_mode: "map_som"
    map_yaml: "/ros2_ws/src/map/lab.yaml"       # map_som : carte affichée (mêmes .pgm/.yaml que le SDK)
    poi_path: "/ros2_ws/src/map/lab_pois.json"  # map_som : POI de test (cf. go2_ai/tools/annotate_map.py)

    # Enchaînement perception/décision :
    #   fused   = 1 génération : plan() décide directement (le moins cher, CPU).
    #   chained = 2 générations : describe() puis plan() qui tient compte de la description.
    reasoning_mode: "fused"

    # Mémoire spatiale : le champ "note" du modèle est enregistré (x,y,yaw) en JSONL.
    # memory_path est SOUS /ros2_ws/src (volume monté) -> persiste côté hôte.
    memory_path: "/ros2_ws/src/go2_ai/spatial_memory.jsonl"
    memory_dedup_dist: 0.5   # m : pas de nouvelle note à moins de ça d'un lieu déjà noté
    memory_recall_limit: 20   # nb max d'amers réinjectés dans le prompt (pertinence + proximité)

    # Refus d'un goal tombé dans un obstacle (costmap local Nav2, repère odom).
    costmap_topic: "/local_costmap/costmap"
    goal_cost_threshold: 90   # 0..100 : cellule >= ce coût = obstacle -> goal ignoré

    # Topics d'entrée — paramétrés pour rester agnostique sim/réel.
    #   réel (single) : "camera/image_raw", "odom"
    #   sim           : "unitree_go2/front_cam/color_image", ...
    image_topic: "camera/image_raw"
    odom_topic: "odom"

    # Consigne haut-niveau + cadence de raisonnement (Hz bas : VLM lent).
    instruction: "explore"
    period_s: 2.0
