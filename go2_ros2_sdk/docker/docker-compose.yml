services:
  unitree_ros:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROBOT_IP=${ROBOT_IP}
      - CONN_TYPE=${CONN_TYPE:-webrtc}        # webrtc | cyclonedds | sim
      - ROBOT_TOKEN=${ROBOT_TOKEN:-}          # required for remote WebRTC connections
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}     # MUST match Isaac Sim's domain in sim mode
      - WEBRTC_SERVER_HOST=0.0.0.0  # Listen on all interfaces
      - WEBRTC_SERVER_PORT=${WEBRTC_SERVER_PORT:-9991}
      - DISPLAY=${DISPLAY:-}  # For GUI applications like rviz2
      # GPU (pour l'inference VLM in-process de go2_ai). Même câblage qu'Isaac.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # Token Hugging Face : colle ta clé dans docker/.env -> HF_TOKEN=hf_xxxxx
      # (débloque des téléchargements plus rapides + rate limit authentifié).
      - HF_TOKEN=${HF_TOKEN:-}
      # Mode HORS-LIGNE : les poids sont déjà dans le volume hf_cache, aucun accès
      # réseau nécessaire à l'inférence. Mets HF_OFFLINE=1 dans docker/.env quand tu
      # es sur le WiFi du Go2 (pas d'internet). Défaut 0 = en ligne (pour pouvoir
      # encore télécharger un nouveau modèle).
      - HF_HUB_OFFLINE=${HF_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${HF_OFFLINE:-0}
      # Localisation 2D : MAP_LOAD=<nom> -> mode localization (map_server + amcl)
      # sur la carte <MAPS_DIR>/<nom>.yaml. Vide -> mapping (slam_toolbox, neuf).
      # MAPS_DIR pointe le dossier monté ./map (persistant, visible côté hôte).
      - MAP_LOAD=${MAP_LOAD:-}
      - MAPS_DIR=${MAPS_DIR:-/ros2_ws/src/map}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 forwarding
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      - ../:/ros2_ws/src
      # Cache Hugging Face persistant : les poids VLM (~8 Go) ne sont téléchargés
      # qu'une fois et survivent à `docker compose down/up`.
      - hf_cache:/root/.cache/huggingface
    network_mode: "host"  # Required for ROS2 discovery and robot communication
    privileged: true  # Required for hardware access
    runtime: nvidia  # Accès GPU (nvidia-container-runtime, déjà utilisé par Isaac)
    devices:
      - /dev/input:/dev/input  # For joystick access
    restart: unless-stopped

volumes:
  hf_cache:  # cache Hugging Face partagé/persistant pour les poids VLM
